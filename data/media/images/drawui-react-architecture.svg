<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="drawui-react architecture: React component wrapping the drawui-core engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b2a8a" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d5ccf6" stroke-opacity="0.35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b7db5"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <text x="64" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#141b2d" font-weight="600">drawui-react</text>
  <text x="64" y="120" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" fill="#5b6b8c" letter-spacing="2">REACT LAYER · ONE COMPONENT OVER THE CORE ENGINE</text>

  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <g filter="url(#shadow)">
      <rect x="64" y="220" width="196" height="104" rx="16" fill="#ffffff" stroke="#dcd4f6"/>
      <rect x="64" y="220" width="6" height="104" rx="3" fill="url(#accent)"/>
      <text x="92" y="268" font-size="17" fill="#141b2d" font-weight="600">Your React app</text>
      <text x="92" y="296" font-size="12.5" fill="#7787a6">state · props · hooks</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="330" y="220" width="196" height="104" rx="16" fill="#ffffff" stroke="#dcd4f6"/>
      <rect x="330" y="220" width="6" height="104" rx="3" fill="url(#accent)"/>
      <text x="358" y="268" font-size="17" fill="#141b2d" font-weight="600">CanvasBoard</text>
      <text x="358" y="296" font-size="12.5" fill="#7787a6">drawui-react component</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="596" y="220" width="196" height="104" rx="16" fill="#ffffff" stroke="#dcd4f6"/>
      <rect x="596" y="220" width="6" height="104" rx="3" fill="url(#accent)"/>
      <text x="624" y="268" font-size="17" fill="#141b2d" font-weight="600">Editor</text>
      <text x="624" y="296" font-size="12.5" fill="#7787a6">drawui-core engine</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="862" y="220" width="196" height="104" rx="16" fill="#ffffff" stroke="#dcd4f6"/>
      <rect x="862" y="220" width="6" height="104" rx="3" fill="url(#accent)"/>
      <text x="890" y="268" font-size="17" fill="#141b2d" font-weight="600">Canvas + panels</text>
      <text x="890" y="296" font-size="12.5" fill="#7787a6">DPR-scaled DOM · toolbar</text>
    </g>

    <g font-size="12.5" fill="#6a5c96">
      <rect x="330" y="176" width="58" height="28" rx="14" fill="#f2edff" stroke="#ddd3fb"/>
      <text x="359" y="195" text-anchor="middle">data</text>
      <rect x="396" y="176" width="88" height="28" rx="14" fill="#f2edff" stroke="#ddd3fb"/>
      <text x="440" y="195" text-anchor="middle">onReady</text>
      <rect x="492" y="176" width="92" height="28" rx="14" fill="#f2edff" stroke="#ddd3fb"/>
      <text x="538" y="195" text-anchor="middle">onChange</text>
      <rect x="592" y="176" width="102" height="28" rx="14" fill="#f2edff" stroke="#ddd3fb"/>
      <text x="643" y="195" text-anchor="middle">themeColor</text>
      <rect x="702" y="176" width="92" height="28" rx="14" fill="#f2edff" stroke="#ddd3fb"/>
      <text x="748" y="195" text-anchor="middle">language</text>
    </g>
  </g>

  <g stroke="#8b7db5" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M266 272H321"/>
    <path d="M532 272H587"/>
    <path d="M798 272H853"/>
  </g>

  <g stroke="#8b7db5" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)">
    <path d="M560 340V388H168V330"/>
  </g>

  <text x="300" y="406" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#7c3aed">
    props go down · changes flow back up (onChange / onReady)
  </text>

  <text x="64" y="446" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#6b7a99">
    The board owns its canvas; React owns only the interface around it.
  </text>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#7c3aed">
    <text x="64" y="478">no second editor</text>
    <circle cx="196" cy="474" r="2.4" fill="#c9bff0"/>
    <text x="212" y="478">cleanup on unmount</text>
    <circle cx="350" cy="474" r="2.4" fill="#c9bff0"/>
    <text x="366" y="478">same Editor API as core</text>
  </g>
</svg>
