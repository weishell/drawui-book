<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="drawui">
  <defs>
    <linearGradient id="drawui-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B6BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板：蓝紫渐变，呼应文档站的主题色 -->
  <rect width="512" height="512" rx="116" fill="url(#drawui-bg)"/>
  <!-- 画布边框：暗示「画布引擎」 -->
  <rect x="104" y="104" width="304" height="304" rx="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="18"/>
  <!-- 字母 d：由画布上的圆与笔杆组成 -->
  <circle cx="244" cy="300" r="66" fill="none" stroke="#FFFFFF" stroke-width="42"/>
  <path d="M330 166v200" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
</svg>
